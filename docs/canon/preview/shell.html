<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forman Canon</title>
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --side: #f3f1ec; --ink: #1d1c1a; --muted: #6b675f; --line: #e3dfd6;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --q: #a15c00; --q-soft: #fff4e2; --d: #1f7a4d; --d-soft: #e5f5ec;
  --s: #5a5f73; --s-soft: #eef0f5; --planned: #8a4fd0; --planned-soft: #f3ecfc; --code-bg: #f6f5f1;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15161a; --panel: #1b1d22; --side: #111215; --ink: #e9e7e2; --muted: #9a978f; --line: #2c2f36;
    --accent: #7ea2ff; --accent-soft: #1e2840; --q: #f0b35a; --q-soft: #2e2416; --d: #5fd39a; --d-soft: #15291f;
    --s: #a5abc0; --s-soft: #23262f; --planned: #c49bff; --planned-soft: #261d33; --code-bg: #0d1117;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
nav.side { background: var(--side); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 700; font-size: 18px; padding: 0 8px 14px; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.group { margin-bottom: 14px; }
.gtitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 8px 4px; }
a.nav { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 6px; color: var(--ink); font-size: 14px; }
a.nav.pending { color: var(--muted); }
a.nav.written { font-weight: 600; }
a.nav.active { background: var(--accent-soft); color: var(--accent); }
.pass { font-size: 10px; border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; color: var(--muted); font-weight: 400; }
main { padding: 40px 48px 120px; max-width: 980px; min-width: 0; }
h1 { font-size: 34px; line-height: 1.2; margin: 6px 0 12px; letter-spacing: -.01em; }
h2 { font-size: 24px; margin: 44px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
h3 { font-size: 18px; margin: 28px 0 8px; }
p, li { max-width: 72ch; }
.lede { color: var(--muted); }
code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre code, pre.hljs-pre code { padding: 0; background: none; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font: 13px/1.55 var(--mono); margin: 0; }
p + pre, ul + pre { margin-top: 10px; }
pre { margin-bottom: 16px; }
figure pre { border: 0; border-radius: 0 0 8px 8px; margin: 0; }
.hljs { background: transparent !important; }
pre code.hljs { padding: 0 !important; display: block; }
table { border-collapse: collapse; width: 100%; margin: 12px 0 20px; font-size: 14px; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
figure { margin: 16px 0 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
figcaption { font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); }
figcaption .src { margin-left: auto; font-family: var(--mono); font-size: 12px; }
.kind { font-weight: 700; color: var(--ink); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; }
.badge.quoted { background: var(--d-soft); color: var(--d); }
.badge.planned { background: var(--planned-soft); color: var(--planned); }
figure.fence.is-planned { border-style: dashed; border-color: var(--planned); }
.st-specified { background: var(--accent-soft); color: var(--accent); }
.st-proved { background: var(--d-soft); color: var(--d); }
.st-draft { background: var(--q-soft); color: var(--q); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); margin: 1px 0; }
.chip.decision { color: var(--d); border-color: var(--d); }
.chip.slice { color: var(--accent); border-color: var(--accent); }
.note { border-left: 4px solid; border-radius: 6px; padding: 10px 14px; margin: 14px 0; }
.note-question { border-color: var(--q); background: var(--q-soft); }
.note-decision { border-color: var(--d); background: var(--d-soft); }
.note-status { border-color: var(--s); background: var(--s-soft); }
.note-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.note-question .kind { color: var(--q); } .note-decision .kind { color: var(--d); } .note-status .kind { color: var(--s); }
.note-body > :first-child { margin-top: 0; } .note-body > :last-child { margin-bottom: 0; }
.model > div { padding: 4px 14px 8px; }
.model .desc { color: var(--muted); margin: 8px 0; }
.model table { margin: 6px 0 10px; }
.state { margin-right: 4px; }
.facts { font-size: 14px; }
.scene .frame { background: #000; line-height: 0; }
.scene video { width: 100%; }
.scene .frame[data-missing] video { display: none; }
.scene .frame[data-missing]::after { content: "Not rendered in this checkout: render it with the visuals skill."; display: block; color: #bbb; padding: 40px 16px; line-height: 1.5; text-align: center; }
.theme-light { display: none; }
@media (prefers-color-scheme: light) { .theme-dark { display: none; } .theme-light { display: block; } }
.status-card { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.page-head .eyebrow, .eyebrow { color: var(--muted); font-size: 13px; }
.page-head .meta { font-size: 14px; color: var(--muted); }
details.questions { margin: 16px 0 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; }
details.questions summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.pending-banner { background: var(--s-soft); border: 1px dashed var(--s); border-radius: 8px; padding: 10px 14px; margin: 12px 0 20px; }
dl.stub dt { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 16px; }
dl.stub dd { margin: 4px 0 0; }
pre.check { color: var(--d); }
a.ref code { color: var(--accent); }
.menu { display: none; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  main { min-width: 0; }
  .page-head .meta, figcaption { word-break: break-word; }
  p, li { overflow-wrap: anywhere; }
  nav.side { position: static; height: auto; display: none; }
  nav.side.open { display: block; }
  .menu { display: block; position: sticky; top: 0; z-index: 2; background: var(--side); border-bottom: 1px solid var(--line); padding: 10px 16px; font-weight: 600; cursor: pointer; }
  main { padding: 20px 16px 80px; }
  h1 { font-size: 28px; }
}
</style>
<style>/*HLJS*/</style>
<style>pre code.hljs { padding: 0 !important; background: transparent !important; }</style>
</head>
<body>
<div class="menu" onclick="document.querySelector('nav.side').classList.toggle('open')">☰ Forman canon</div>
<div class="layout">
<nav class="side"><div class="brand">Forman canon<small>pass 1 preview · PR #38</small></div><!--NAV--></nav>
<main><!--PAGES--></main>
</div>
<script>
/*SCENES*/
function show() {
  const id = (location.hash || "#page-readme").slice(1).split("--")[0];
  const target = document.getElementById(id) ? id : "page-readme";
  document.querySelectorAll("section.page").forEach((s) => { s.hidden = s.id !== target; });
  document.querySelectorAll("a.nav").forEach((a) => a.classList.toggle("active", a.dataset.page === target));
  document.querySelectorAll(`#${target} video[data-scene]`).forEach((v) => { if (!v.src && SCENES[v.dataset.scene]) { v.src = SCENES[v.dataset.scene]; v.play().catch(() => {}); } else if (!SCENES[v.dataset.scene]) v.parentElement.dataset.missing = ""; });
  document.querySelector("nav.side").classList.remove("open");
  requestAnimationFrame(() => window.scrollTo(0, 0));
}
addEventListener("hashchange", show);
show();
</script>
</body>
</html>
