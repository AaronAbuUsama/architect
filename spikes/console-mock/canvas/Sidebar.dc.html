<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","threads","graph","presets","team","editor","tools","mcp","skills","ext","env","settings","deploy"],"default":"overview"},"$preview":{"width":248,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const keys = ['overview','threads','graph','presets','team','editor','tools','mcp','skills','ext','env','settings','deploy'];
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 9px; font-size: 14px; font-weight: 550; ';
    const s = {}; const c = {};
    keys.forEach((k) => {
      const on = k === active;
      s[k] = base + (on ? 'background: #232326; color: #ffffff;' : 'color: #c4c4cc;');
      c[k] = on ? 'page' : undefined;
    });
    return { s, c };
  }
}
</script>
