receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  # option (a): OTLP JSON lines on a mounted folder
  file/traces:
    path: /out/traces.jsonl
    flush_interval: 10ms
  file/logs:
    path: /out/logs.jsonl
    flush_interval: 10ms
  # option (b): Jaeger v2 trace store with a query API (traces only)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
service:
  pipelines:
    traces: { receivers: [otlp], exporters: [file/traces, otlp/jaeger] }
    logs:   { receivers: [otlp], exporters: [file/logs] }
