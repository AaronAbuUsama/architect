<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission board</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/3f618e8b6fb767b1f163c1b6be27a379">
<link rel="stylesheet" href="/_blob/384061031833fc1f1e19b35c1eb670fe">
<link rel="stylesheet" href="/_blob/cfade0ea5f81b845e232ca2458bf3ba9">
<script src="/_blob/d0f73a936b3e21c03ca2443952cd24d0"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div class="dark console-root" data-theme="dark" style="min-height: 100vh; width: 100%;">
<div ref="{{host}}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"columns":{"editor":"enum","options":["state","output","stage"],"default":"state","section":"Switches"},"detail":{"editor":"enum","options":["panel","modal","page"],"default":"panel","section":"Switches"},"tab":{"editor":"enum","options":["board","climb","overview"],"default":"board","section":"Switches"},"history":{"editor":"enum","options":["real","illustrative"],"default":"real","section":"Data"},"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const opts = {
      grid: "/_blob/1ec3172153edf7df2d1e5bfe735afff9",
      board: (p.history ?? "real") === "illustrative" ? "/_blob/10d46f642efc1b2f43dab8713cc3c685" : "/_blob/6ec9327935b99676491af55e6ac87986",
      columns: p.columns ?? "state",
      detail: p.detail ?? "panel",
      tab: p.tab ?? "board",
      open: "visibility.api"
    };
    return {
      host: (el) => {
        if (!el) return;
        const go = () => window.MissionBoard.mount(el, opts);
        if (window.MissionBoard) go(); else window.addEventListener("load", go, { once: true });
      }
    };
  }
}
</script>
</body>
</html>
