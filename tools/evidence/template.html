<title>Architect Build Evidence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one narrow column of steps, newest first; each run is a collapsible terminal capture. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2230; --muted: #5d6677; --line: #dde1e8;
  --accent: #3355d4; --pass: #1f7a4d; --pass-bg: #e3f3ea; --planted: #8a5a00; --planted-bg: #fbf0d9;
  --bad: #b3261e; --bad-bg: #fbe4e2; --term: #121722; --term-fg: #d6dbe6; --term-dim: #8b93a6; --prompt: #7fb2ff;
  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131b; --surface: #161b25; --fg: #e4e8f0; --muted: #98a1b3; --line: #262d3a;
  --accent: #8aa6ff; --pass: #6fd3a0; --pass-bg: #163326; --planted: #f0c060; --planted-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #3d1a18;
  --term: #0a0d13; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #161b25; --fg: #e4e8f0; --muted: #98a1b3; --line: #262d3a;
  --accent: #8aa6ff; --pass: #6fd3a0; --pass-bg: #163326; --planted: #f0c060; --planted-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #3d1a18;
  --term: #0a0d13; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
header h1 { font-family: var(--display); font-size: 1.6rem; margin: 0; text-wrap: balance; }
header p { color: var(--muted); margin: 6px 0 0; }
a { color: var(--accent); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.stage { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--display); font-size: 1.25rem; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.id { font-family: var(--mono); font-size: .9rem; color: var(--muted); }
.summary { margin: 0; }
.proves { font-size: .9rem; border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.proves .label { display: block; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg); }
.links { font-size: .85rem; color: var(--muted); }
.chip { font-family: var(--body); font-size: .7rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.pass { color: var(--pass); background: var(--pass-bg); }
.chip.planted { color: var(--planted); background: var(--planted-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.run { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.run summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; list-style: none; }
.run summary::-webkit-details-marker { display: none; }
.run summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cap { flex: 1 1 220px; min-width: 0; }
.meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.term { background: var(--term); border-radius: 8px; margin-top: 10px; overflow-x: auto; }
.prompt { font-family: var(--mono); font-size: .78rem; color: var(--prompt); padding: 10px 12px 0; white-space: pre-wrap; word-break: break-all; }
.term pre { font-family: var(--mono); font-size: .75rem; color: var(--term-fg); margin: 0; padding: 8px 12px 12px; line-height: 1.5; }
</style>
<main>
  <header>
    <h1>Architect build evidence</h1>
    <p>Every run below was captured by a script as it happened, on the commit shown. Planted failures are meant to fail. Newest step first.</p>
  </header>
  <!--STEPS-->
</main>
