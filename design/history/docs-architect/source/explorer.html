<main id="explorer-view" hidden>
  <div class="ide">
    <div class="tree" id="tree" aria-label="Files"></div>
    <div class="pane" id="pane"></div>
  </div>
  <section class="panel" id="panel" aria-label="Walkthrough">
    <div class="panel-bar">
      <button id="panel-toggle" type="button" aria-expanded="true" aria-label="Hide the terminal">▾</button>
      <span id="rail-count"></span>
      <b id="rail-title"></b>
      <span id="rail-stage"></span>
      <div class="rail-nav">
        <button id="rail-back" type="button" aria-label="Previous step">←</button>
        <div id="rail-dots"></div>
        <button id="rail-next" type="button" aria-label="Next step">→</button>
      </div>
    </div>
    <div class="panel-body" id="panel-body">
      <div><p id="rail-say"></p><p id="rail-see" class="rail-see"></p></div>
      <div class="term"><pre class="code term" id="rail-cmd"></pre><pre class="out" id="rail-out"></pre></div>
    </div>
  </section>
</main>
