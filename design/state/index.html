const ALL_PAGES = [
{ id: "now", group: "Start", t: "Where it stands", h: () => `

</ul>

{ id: "intro", group: "Start", t: "What Architect is", h: () => `
<h1>What Architect is</h1>
<p class="lede">Architect is Effect, one level up. You declare the whole system as typed code: its things, their state machines,
the events and errors, the steps, who may call each operation, how fast it must be and where it runs. That is the blueprint.</p>
<p>Everything else falls out of the blueprint: the server, the API, the SDK, the CLI, the docs, and later the MCP server and the portal.
Generated files are never edited by hand.</p>
<p>You, or an agent, fill in only the blanks: a handler for each operation, in a scaffold at <code>src/&lt;thing&gt;/&lt;operation&gt;.ts</code> that already fits.</p>
<p>Every operation is measured by nine evals, read from real telemetry: answer shape, declared errors, machine path, events, who may call,
steps, performance, coverage and explainability.</p>
<p>It's built in five layers, each closed by a gate, and everything runs for real on your Mac, in Cloudflare's own local runtime, with nothing mocked.</p>
<div class="loops">
  <div class="loop"><div class="loop-name">Design loop</div><div class="loop-stages"><span class="s-done">Ideate</span><span class="s-done">Spike</span><span class="s-done">Specify</span></div><div class="loop-out">The blueprint, blanks and scaffolds work today.</div></div>
  <div class="loop"><div class="loop-name">Build loop</div><div class="loop-stages"><span class="s-done">Build</span><span class="s-done">Test</span><span class="s-done">Deploy</span><span class="s-done">Watch</span></div><div class="loop-out">All four run across local environments.</div></div>
</div>
<p class="muted">The worked example is acme: the starter project (sign-up, organisations, members, invitations, API keys) plus the allowance, an owner letting a member spend up to a limit.</p>` },

{ id: "get", group: "Start", t: "What you get, today", h: () => `

<tr><td><b>The portal</b>, the blueprint and what's proven where</td><td class="s">${DONE}</td></tr>
<tr><td colspan="2" class="muted">A plain read-only page at <code>/portal</code> on every environment. A designed docs site on top of it is next (F2, F3).</td></tr>
<tr><td><b>The world</b> as a Durable Object, with its clock and test worlds</td><td class="s">${DONE}</td></tr>

</tbody></table></div>
<h2>Kept for you</h2>

<tr><td colspan="2" class="muted"><code>architect watch</code> reads local files or Axiom. Traces show locally in a viewer, and in Axiom by config.</td></tr>
<tr><td><b>The infrastructure</b>, an Alchemy stack per environment</td><td class="s">${CLOUD}</td></tr>
</tbody></table></div>` },

{ id: "layers", group: "Progress", t: "The five layers", h: () => `

    <div class="bar"><i style="width:0%"></i></div>

{ id: "current-layer", group: "Progress", t: `${CURRENT_LAYER.label}, step by step`, h: () => `

<p>Independent author checks come before the builder. The current partial Gate 3 target remains red until its complete wallet, chain, relay and reorg journeys exist and pass. Research and records do not count as implemented steps.</p>` },

{ id: "current-code", group: "Progress", t: "Current step: code walkthrough", h: () => "<h1>What the current step is building</h1><p class=\"lede\">L3.01 builds the plugin mechanism. A project selects a finished capability; Architect brings its declarations, implementation and proof dependencies into the same pipeline as project operations. The code below is the decided contract. The package fixture already runs independently, but Architect does not implement its selection or generated wiring yet.</p><h2>1. The project chooses a kit</h2><p>One command writes one choices file. The project does not copy handlers or import the underlying SDK.</p><pre><code>architect add kit @fixture/echo --as fixture</code></pre><pre><code>// blueprint/kits/fixture.ts\nimport { Blueprint } from &quot;@architect/blueprint&quot;;\nimport { Fixture } from &quot;@fixture/echo&quot;;\n\nexport default Blueprint.kit(Fixture, { prefix: &quot;Hello: &quot; });</code></pre><h2>2. The package separates declarations from execution</h2><p>The descriptor says where to find each entry. Descriptor and declaration entries are pure; browser clients never import the Worker or Node implementation. Actual secrets and local keystore paths are injected at the process entry.</p><pre><code>export const Fixture = {\n  choices: Choices,\n  defaults: { prefix: &quot;&quot; },\n  declarations,\n  sources: {\n    descriptor: &quot;@fixture/echo&quot;,\n    declarations: &quot;@fixture/echo/blueprint&quot;,\n    worker: &quot;@fixture/echo/worker&quot;,\n    node: &quot;@fixture/echo/node&quot;,\n  },\n};</code></pre><h2>3. Its Worker supplies finished behavior</h2><p>This factory shape is already present in the authored fixture. The handler and layer are adopted from the independently tested experiment. Architect must wire them, not scaffold an empty project handler.</p><pre><code>export const make = (choices, declarations) =&gt; ({\n  handlers: { echo: { repeat } },\n  layer: layer(choices),\n});\n\n// The existing behavior reads its configured Prefix service.\nconst repeat = (payload) =&gt;\n  Effect.map(Prefix, ({ value }) =&gt; ({ text: value + payload.text }));</code></pre><h2>4. Architect compiles and generates the connection</h2><p>The compiler learns the canonical operation identity <code>kit:fixture:echo.repeat</code>, its package provenance and source integrity. That identity is separate from safe file paths and TypeScript names. The generators emit the HTTP route, typed SDK and MCP tool, and provide the kit layer to both server transports.</p><pre><code>// Intended generated client surface\nSdk.kits.fixture.echo.repeat({ text: &quot;world&quot; });\n// Expected answer with these choices: { text: &quot;Hello: world&quot; }</code></pre><p>The intended HTTP route is <code>/kits/fixture/echo/repeat</code>. The logical SDK call returns an Effect, following the existing SDK style. The actual caller/transport setup is generated around it.</p><h2>5. Dependencies wrap libraries the project calls</h2><p>A kit arrives finished. A dependency wrapper is for a foreign callable whose failures you must map to your own declared errors. The command writes a pure descriptor and a runtime wrapper, with exactly one blank across the pair.</p><pre><code>// blueprint/dependencies/pricing.ts — no vendor runtime import\nexport const quote = Blueprint.dependency({\n  package: &quot;@fixture/remote&quot;, version: &quot;1.0.0&quot;,\n  mode: &quot;promise&quot;, errors: [PriceUnavailable], step: &quot;network&quot;,\n});</code></pre><pre><code>// src/dependencies/pricing.ts — runtime imports stay here\nexport const quote = Dependencies.implementation(declaration, {\n  call,\n  failure: Blueprint.todo(&quot;map the failure to PriceUnavailable&quot;),\n});\n\n// Once filled, the only application-specific choice might be:\nfailure: (_failure) =&gt; new PriceUnavailable({ reason: &quot;pricing unavailable&quot; });</code></pre><p>The generated Pricing service infers arguments and results from the library. Promise mode counts the request until its returned promise settles; it does not pretend cancellation stopped an arbitrary SDK. Effect mode maps typed failures while retaining defects and interruption.</p><h2>6. The same graph decides what becomes stale</h2><p>An operation declares <code>uses: [quote]</code>. Dependencies and selected kits can declare their own uses. If the kit, callable package or mapping implementation changes, its consumers become stale. Unrelated operations stay proven. Impact must show those relationships.</p><h2>What counts as finished</h2><p>One command adds the real packed fixture; generated SDK and HTTP/MCP calls execute it; choices affect its answer; client bundles exclude runtime-only imports; graph and integrity changes invalidate the right proofs; and earlier nine-eval behavior remains intact. Wallets, relaying and the follower are later steps built on this foundation.</p>" },

{ id: "delays", group: "Progress", t: "What has taken the time", h: () => "<h1>What has taken the time</h1><p class=\"lede\">Most of the delay has been finishing layer two safely, then defining and checking the kit boundary before the first layer-three implementation. This has taken too long to turn into a first working slice.</p>\n<ol><li><b>Real layer-two correctness work.</b> Reviews found problems with artifact/proof identity, world isolation, process ownership, immutable model admission and first-call MCP telemetry. Those needed code fixes and real-service proofs, not another green rerun.</li>\n<li><b>Repeated integration-test deadline failures.</b> Real worker restarts and CLI processes sometimes exceeded Vitest's default five seconds in CI. Authors gave those integration bodies explicit bounds without changing assertions or domain performance budgets. Each recovery repeated PR and main CI. One model-written handler also missed its state update; the proof rejected it and one recorded unchanged resample passed.</li>\n<li><b>The new kit boundary had a genuine design trap.</b> Importing a dependency callable or mapper from a declaration would pull its runtime into client code. We split pure declarations from runtime implementations. We also made descriptor purity, names, dependency edges and source integrity explicit.</li>\n<li><b>Coordination overhead.</b> I spent too long on contract refinement, a broad acceptance package and serial record landings before delivering the first L3.01 implementation. The artifact navigation also stayed on the old layer. That part is a process and reporting failure, not a remaining layer-two blocker.</li></ol>\n<h2>The issue right now</h2><p>Main is green. There is no credential, budget or user decision blocking the next step. The remaining work before the builder is to finish and review the immediate dependency runtime guards and integrated author suite. Then the priority is a real kit selection reaching a generated SDK call.</p>\n<p>Logged model-assisted CI spend is $1.17 against the $10 daily cap. This is the recorded CI total, not a claim about unrelated account spending. All experiment runtime cleanup was recorded.</p>" },

{ id: "works", group: "Progress", t: "What works on your Mac", h: () => `
<h1>What works on your Mac</h1>
<p class="lede">Each line is checked against a captured run in the repo's evidence.</p>
<h2>Declare and call</h2>
<ul>
<li><code>architect prove --env local</code> proves acme's eleven journeys, with nine evals on each of fifteen operations, in about eight seconds.</li>
<li><code>architect check</code> fails whenever the code and the blueprint disagree.</li>
<li><code>architect add</code> and <code>generate</code> scaffold a new thing or operation, with its blanks marked.</li>
<li><code>architect brief</code> tells an agent exactly what to write, what not to touch, and which evals must pass.</li>
<li><code>architect impact</code> says which proofs a change made stale.</li>
<li>An agent wrote the allowance's spend handler from its brief alone, and it passed, for five cents.</li>
<li>A new project made from the preset passes check and prove.</li>
</ul>
<h2>Prove and ship</h2>
<ul>
<li><code>architect build</code> turns one revision into one bundle with one hash.</li>
<li><code>architect env up</code> runs test, staging and production side by side, each with its own state.</li>
<li><code>architect prove --env test</code> proves in a fresh world, signs a verdict per operation, and destroys the world.</li>
<li><code>architect worlds reap</code> removes worlds that outlived their lifetime.</li>
<li><code>architect version --next</code> works out the next version from what changed.</li>
<li><code>architect promote</code> moves the same bundle from test to staging to production, only on green verdicts.</li>
<li><code>architect publish --local</code> puts the SDK and CLI on a local npm registry, and the CLI in a Homebrew tap.</li>
<li><code>acme session sign-in</code> signs the generated CLI in with a device code.</li>
<li><code>architect telemetry view</code> and <code>prove --view</code> show each trace in a local viewer; Axiom is one line of config.</li>
<li>An MCP client signs in with OAuth and calls acme's operations as tools; a caller without the role is refused.</li>
<li><code>architect watch --env staging</code> prints p95 against budget and refusal counts, and a planted slow handler shows as drift.</li>
<li><code>/portal</code> on staging shows every operation per environment: proven, failed, stale with the reason, or unproven.</li>
</ul>` },

{ id: "risks", group: "Decisions", t: "Risks and known issues", h: () => `

const PAGES = ALL_PAGES;

/* ---------- Docs ---------- */
const nav = document.getElementById("docnav");
{
  let group = "";
  nav.innerHTML = PAGES.map((pg) => {
    const head = pg.group !== group ? "<h4>" + pg.group + "</h4>" : "";
    group = pg.group;
    return head + '<a href="#' + pg.id + '" data-id="' + pg.id + '">' + pg.t + "</a>";
  }).join("");
}
let currentPage = null;
function renderDoc(id) {
  const page = PAGES.find((p) => p.id === id) || PAGES[0];
  document.getElementById("doc").innerHTML = page.h();
  document.querySelector("#doc h1").id = "page-title";
  document.title = page.t + " · Architect status";
  nav.querySelectorAll("a").forEach((a) => a.setAttribute("aria-current", a.dataset.id === page.id ? "page" : "false"));
  const moved = currentPage !== page.id;
  currentPage = page.id;
  return moved;
}

/* ---------- Navigation ---------- */
const doc = document.getElementById("doc");
const pagesToggle = document.getElementById("pages-toggle");
function setNavigation(open) {
  document.body.dataset.navigationOpen = String(open);
  pagesToggle.setAttribute("aria-expanded", String(open));
}
pagesToggle.addEventListener("click", () => setNavigation(pagesToggle.getAttribute("aria-expanded") !== "true"));
document.querySelector(".skip-link").addEventListener("click", (event) => {
  event.preventDefault();
  doc.focus({ preventScroll: true });
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && pagesToggle.getAttribute("aria-expanded") === "true") {
    setNavigation(false);
    pagesToggle.focus();
  }
});

/* ---------- Routing ---------- */
function route() {
  const navigating = currentPage !== null;
  const fromNavigation = nav.contains(document.activeElement);
  const requested = location.hash.slice(1) || "now";
  const target = requested === "stage3" ? "current-layer" : requested;
  if (requested === "stage3") history.replaceState(null, "", "#current-layer");
  const moved = renderDoc(target);
  if (moved) doc.scrollTop = 0;
  setNavigation(false);
  if (navigating && fromNavigation) doc.focus({ preventScroll: true });
}
window.addEventListener("hashchange", route);
route();
</script>
