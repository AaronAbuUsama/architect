# The registry the publish tests run (D3 #9, #113): anyone may read and publish the project's own names (@acme/*, and the unscoped
# `acme`, which exists on npm) and Orthograph's, none of which is ever proxied to npm; everything else is, so an install finds
# its dependencies (effect and the rest).
storage: /verdaccio/storage
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 10
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    timeout: 120s
    max_fails: 100
    fail_timeout: 2s
    agent_options:
      keepAlive: true
      maxSockets: 32
packages:
  '@acme/*':
    access: $all
    publish: $all
    unpublish: $all
  'acme':
    access: $all
    publish: $all
    unpublish: $all
  # The front door is the plain package orthograph (K6); every other package is @orthograph/*.
  'orthograph':
    access: $all
    publish: $all
    unpublish: $all
  '@orthograph/*':
    access: $all
    publish: $all
    unpublish: $all
  '**':
    access: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
