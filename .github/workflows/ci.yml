name: ci

on:
  push:
    branches: [main, "layer/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint,typecheck,test --outputStyle=static
      # Nx 24 skips task-level sync generators in CI, so drift is checked explicitly.
      - run: pnpm nx sync:check
