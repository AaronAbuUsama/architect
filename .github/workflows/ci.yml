name: ci

on:
  push:
    branches: [main, "layer/**", "m[0-9]"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # A world's chain is Anvil as a plain process (K10 section 8: no container, no Docker step). Foundry is pinned
      # to an exact version, and the tests that start Anvil run here (M1.31).
      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
      - run: anvil --version
      - run: pnpm nx run-many -t lint,typecheck,test --outputStyle=static
        env:
          ORTHO_CHAIN_EVM_ANVIL: "1"
      # Nx 24 skips task-level sync generators in CI, so drift is checked explicitly.
      - run: pnpm nx sync:check

  # Gate 1 (L1.60): the seven checks of layer one, run as a user runs Orthograph (D2 #74).
  e2e-layer1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # Check 4 runs its agent when this secret exists, and says why it skipped when it doesn't (D2 #41).
      # The key is given only to pull requests into main and pushes to main, so layer-branch pushes spend nothing
      # (each run is capped at $5, and the cap across everything is $10 a day; D3 #71).
      - run: pnpm nx run e2e:layer1 --outputStyle=static
        env:
          ANTHROPIC_API_KEY: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main') && secrets.ANTHROPIC_API_KEY || '' }}

  # Gate 2 (L2.11): all eight authored shipping checks, including the Linux Homebrew install.
  e2e-layer2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      - name: Require Homebrew for Gate 2
        shell: bash
        run: |
          brew_bin=/home/linuxbrew/.linuxbrew/bin
          if [[ ! -x "$brew_bin/brew" ]]; then
            echo "::error::Gate 2 requires the runner's preinstalled Homebrew; the install check must run."
            exit 1
          fi
          echo "$brew_bin" >> "$GITHUB_PATH"
          "$brew_bin/brew" --version
      - run: NX_DAEMON=false pnpm nx run e2e:layer2 --outputStyle=static

  # Gate M0 (M0.06): no old name outside the records, and the design docs build with every link resolving.
  # The canon's check (docs/canon/README.md) runs beside it: every quote, reference and component in the MDX pages.
  # Gates 1 and 2 above are the rest of `nx run e2e:m0`, run as their own jobs so they run side by side.
  e2e-m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run e2e:m0-names --outputStyle=static
      - run: pnpm nx run docs:check --outputStyle=static
      - run: pnpm nx run canon:check --outputStyle=static

  # M1's checks also run together in CI. Some checks are red until their slice lands, so the job reports and never
  # blocks; Gate M1 (M1.15) makes it required.
  e2e-m1:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not yet removed from this job's PATH: check 09's `dockerIsUp` (e2e/m1/09-wallet-journeys.test.ts:46) still asks `docker info`
      # and fails closed until the author drops it (M1.33's report). Nothing here starts a container.
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # Check 09's send journeys run on Anvil, a plain process, the same pinned Foundry as the check job (M1.31).
      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
      - run: pnpm nx run e2e:m1-checks --outputStyle=static
