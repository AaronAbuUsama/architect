name: codex-finished

# Proposal 2 (design/process/proposals.md): "Codex has finished" is a landing condition. This workflow posts a commit
# status, `codex-finished`, on a pull request's head: success once Codex's summary comment says its review has completed
# and that review still covers the head, pending otherwise (comment "@codex review"). Branch protection requires it, so a
# pull request cannot merge while Codex is at work, nor with code Codex has not seen. tools/ci/codex-state.sh reads the
# state; tools/ci/codex-covers.sh decides whether a review of an older commit covers the head, which it does only when
# everything since is a clean merge from the base branch (updating a branch for strict mode needs no second review).
#
# It runs from the default branch for every pull request, whatever its base: on Codex's comments (Codex edits one
# summary comment as reviews start and finish), on every ci run a push starts (a new head needs its own status), and by
# hand for one pull request. It never checks out or runs a pull request's code, and uses only the GITHUB_TOKEN.
on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [ci]
    types: [requested]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  status:
    # Other people's comments start the workflow too; only the Codex app's comments on a pull request go further.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time per pull request, so an older reading never lands after a newer one.
    concurrency:
      group: codex-finished-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}
      cancel-in-progress: false
    steps:
      # The default branch's scripts, and every branch's history (the base a merge must come from). Pull request heads are
      # fetched below as objects only; nothing from them is checked out or run.
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: tools/ci
          fetch-depth: 0
      - name: Post codex-finished on each pull request's head
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: >-
            ${{ github.event.issue.number || inputs.pr ||
                join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          if [ -z "$PRS" ]; then echo "No pull request for this run."; exit 0; fi
          for pr in $PRS; do
            read -r head base < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q '"\(.head.sha) \(.base.ref)"')
            reading=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$pr/comments" | tools/ci/codex-state.sh)
            IFS=$'\t' read -r state reviewed description <<< "$reading"
            if [ "$state" = success ] && [ "$reviewed" != "$head" ]; then
              # Right after a push the pull request's ref can lag the API's head; wait for it rather than report a gap.
              for _ in 1 2 3 4 5 6; do
                git fetch -q origin "+refs/pull/$pr/head:refs/remotes/pr/$pr"
                git cat-file -e "$head^{commit}" 2>/dev/null && break
                sleep 5
              done
              if ! why=$(tools/ci/codex-covers.sh "$reviewed" "$head" "origin/$base"); then
                state=pending
                description="Codex reviewed ${reviewed:0:7}; since then $why; comment @codex review"
              fi
            fi
            echo "#$pr at $head: $state, $description"
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$head" \
              -f state="$state" -f context=codex-finished -f description="${description:0:140}" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr" > /dev/null
          done
