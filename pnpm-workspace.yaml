packages:
  - packages/*
  - examples/*
  - e2e
allowBuilds:
  # Off until CI has HEROUI_AUTH_TOKEN: Pro's postinstall fails the whole install without a licence.
  '@heroui-pro/react': false
  '@zowe/secrets-for-zowe-sdk': false
  esbuild: true
  nx: true
  workerd: true
overrides:
  # Better Auth would resolve 0.29.9 (12 November 2026), under two weeks old; one copy keeps its types whole.
  kysely: 0.29.7
# AGENTS.md: versions published at least two weeks before they are added, transitive ones included (D2 #79).
minimumReleaseAge: 20160
