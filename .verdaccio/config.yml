# Local npm registry for e2e: only @orthograph/* and @acme/* are published here; everything else proxies to npmjs.
storage: ../tmp/local-registry/storage
auth:
  htpasswd:
    file: ../tmp/local-registry/htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  # The front door is the plain package orthograph (K6); every other package is @orthograph/*.
  'orthograph':
    access: $all
    publish: $all
    unpublish: $all
  '@orthograph/*':
    access: $all
    publish: $all
    unpublish: $all
  '@acme/*':
    access: $all
    publish: $all
    unpublish: $all
  '**':
    access: $all
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn
